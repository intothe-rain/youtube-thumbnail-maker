<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>편집 — 썸네일 메이커</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&family=Noto+Sans+KR:wght@600;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="page-editor">

  <header class="app-header">
    <a href="index.html" class="btn-back">← 목록</a>
    <span id="template-name" class="header-tmpl-name"></span>
  </header>

  <main class="editor-layout">

    <!-- 컨트롤 패널 -->
    <aside class="controls">

      <!-- 배경 -->
      <div class="ctrl-section">
        <p class="ctrl-title">배경</p>
        <div class="tab-row">
          <button class="tab active" data-tab="image">이미지</button>
          <button class="tab" data-tab="color">색상</button>
        </div>
        <div id="bg-image-panel">
          <input type="file" id="bg-file" accept="image/*" hidden>
          <div id="bg-upload-zone" class="upload-zone">
            <span class="upload-icon">🖼️</span>
            <p>클릭 또는 드래그</p>
            <button class="btn btn-ghost btn-sm" id="btn-bg-upload">파일 선택</button>
          </div>
          <div id="bg-preview" class="img-preview hidden">
            <img id="bg-preview-img" alt="배경">
            <button class="btn btn-ghost btn-sm" id="btn-bg-change">변경</button>
          </div>
        </div>
        <div id="bg-color-panel" class="hidden">
          <div class="color-row">
            <input type="color" id="bg-color" class="color-picker">
            <span id="bg-color-val" class="color-val">#B8860B</span>
          </div>
        </div>
      </div>

      <!-- 인물 사진 -->
      <div class="ctrl-section">
        <p class="ctrl-title">인물 사진</p>
        <input type="file" id="person-file" accept="image/*" hidden>
        <div id="person-upload-zone" class="upload-zone">
          <span class="upload-icon">🧍</span>
          <p>투명 PNG 권장</p>
          <button class="btn btn-ghost btn-sm" id="btn-person-upload">파일 선택</button>
        </div>
        <div id="person-preview" class="img-preview hidden">
          <img id="person-preview-img" alt="인물">
          <div class="btn-row">
            <button class="btn btn-ghost btn-sm" id="btn-person-change">변경</button>
            <button class="btn btn-ghost btn-sm" id="btn-person-remove">제거</button>
          </div>
        </div>
        <div id="person-controls" style="display:none;flex-direction:column;gap:7px;">
          <label class="ctrl-label">크기 <span id="person-size-val">100%</span></label>
          <input type="range" id="person-size" class="slider" min="30" max="200" value="100">
          <p class="tip">캔버스에서 드래그로 이동</p>
        </div>
      </div>

      <!-- 폰트 -->
      <div class="ctrl-section">
        <p class="ctrl-title">폰트</p>
        <select id="font-select" class="input-field">
          <option value="Black Han Sans">블랙한산스 (무료 추천)</option>
          <option value="Jua">주아체 (Jua)</option>
        </select>
        <input type="file" id="font-file" accept=".ttf,.otf,.woff,.woff2" hidden>
        <div style="display:flex;align-items:center;gap:8px;">
          <button class="btn btn-ghost btn-sm" id="btn-font-upload">폰트 파일 불러오기</button>
          <span id="font-upload-name" class="tip"></span>
        </div>
        <p class="tip">구매한 폰트(.ttf/.otf)를 직접 불러올 수 있습니다</p>
      </div>

      <!-- 텍스트 -->
      <div class="ctrl-section">
        <p class="ctrl-title">텍스트</p>

        <!-- 메인 제목 -->
        <div class="input-group">
          <label class="ctrl-label">메인 제목</label>
          <textarea id="input-title" class="input-field" rows="3" placeholder="메인 제목&#10;(엔터로 줄바꿈)"></textarea>
          <label class="ctrl-label">크기 <span id="title-size-val">220</span>px</label>
          <input type="range" id="title-size" class="slider" min="60" max="320" value="220">
          <label class="ctrl-label">색상</label>
          <div class="color-row">
            <input type="color" id="title-color" class="color-picker" value="#ffffff">
            <span id="title-color-val" class="color-val">#FFFFFF</span>
          </div>
          <label class="ctrl-label">윤곽선 굵기 <span id="title-stroke-size-val">14</span>px</label>
          <input type="range" id="title-stroke-size" class="slider" min="0" max="30" value="14">
          <label class="ctrl-label">윤곽선 색상</label>
          <div class="color-row">
            <input type="color" id="title-stroke-color" class="color-picker" value="#000000">
            <span id="title-stroke-color-val" class="color-val">#000000</span>
          </div>
          <label class="ctrl-check">
            <input type="checkbox" id="title-italic"> 기울임
          </label>
        </div>

        <hr class="divider">

        <!-- 서브 제목 -->
        <div class="input-group">
          <label class="ctrl-label">서브 제목</label>
          <input type="text" id="input-sub" class="input-field" placeholder="서브 제목">
          <label class="ctrl-label">크기 <span id="sub-size-val">84</span>px</label>
          <input type="range" id="sub-size" class="slider" min="30" max="160" value="84">
          <label class="ctrl-label">색상</label>
          <div class="color-row">
            <input type="color" id="sub-color" class="color-picker" value="#ffffff">
            <span id="sub-color-val" class="color-val">#FFFFFF</span>
          </div>
          <label class="ctrl-label">윤곽선 굵기 <span id="sub-stroke-size-val">6</span>px</label>
          <input type="range" id="sub-stroke-size" class="slider" min="0" max="30" value="6">
          <label class="ctrl-label">윤곽선 색상</label>
          <div class="color-row">
            <input type="color" id="sub-stroke-color" class="color-picker" value="#000000">
            <span id="sub-stroke-color-val" class="color-val">#000000</span>
          </div>
          <label class="ctrl-check">
            <input type="checkbox" id="sub-italic"> 기울임
          </label>
        </div>

        <p class="tip">캔버스에서 텍스트를 드래그로 이동</p>
      </div>

      <!-- 다운로드 -->
      <div class="ctrl-section">
        <p class="ctrl-title">다운로드</p>
        <div class="btn-row">
          <button class="btn btn-download" id="btn-720">
            <span class="res">720p</span>
            <span class="dim">1280×720</span>
          </button>
          <button class="btn btn-download btn-hd" id="btn-1080">
            <span class="res">1080p</span>
            <span class="dim">1920×1080</span>
          </button>
        </div>
      </div>

    </aside>

    <!-- 캔버스 -->
    <div class="preview-area">
      <p class="preview-label">미리보기 <span id="zoom-val">100%</span> — Ctrl+스크롤 확대/축소 · 더블클릭 초기화</p>
      <div class="canvas-wrap">
        <canvas id="canvas" width="1280" height="720"></canvas>
      </div>
    </div>

  </main>

  <script src="templates.js"></script>
  <script src="editor.js"></script>
</body>
</html>
