<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>썸네일 메이커</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@600;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="page-index">

  <header class="app-header">
    <span class="logo-icon">▶</span>
    <span class="logo-text">썸네일 메이커</span>
  </header>

  <main class="index-main">
    <div class="index-hero">
      <h1 class="hero-title">어떤 스타일로 만들까요?</h1>
      <p class="hero-sub">템플릿을 선택하면 바로 편집이 시작됩니다</p>
    </div>

    <div id="category-tabs" class="category-tabs"></div>
    <div id="template-grid" class="index-grid"></div>
  </main>

  <script src="templates.js"></script>
  <script>
    const grid = document.getElementById('template-grid');
    const tabsEl = document.getElementById('category-tabs');
    let activeCategory = '전체';

    // 카테고리 목록 생성
    const categories = ['전체', ...new Set(TEMPLATES.map(t => t.category))];

    function renderTabs() {
      tabsEl.innerHTML = '';
      categories.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'cat-tab' + (cat === activeCategory ? ' active' : '');
        btn.textContent = cat;
        btn.addEventListener('click', () => {
          activeCategory = cat;
          renderTabs();
          renderGrid();
        });
        tabsEl.appendChild(btn);
      });
    }

    function renderGrid() {
      const filtered = activeCategory === '전체'
        ? TEMPLATES
        : TEMPLATES.filter(t => t.category === activeCategory);

      grid.innerHTML = '';
      filtered.forEach(tmpl => {
        const card = document.createElement('a');
        card.className = 'tmpl-card';
        card.href = `editor.html?id=${tmpl.id}`;
        card.innerHTML = `
          <div class="tmpl-thumb">
            <img src="${tmpl.thumbnail}" alt="${tmpl.name}">
          </div>
          <div class="tmpl-info">
            <span class="tmpl-name">${tmpl.name}</span>
            <span class="tmpl-cat">${tmpl.category}</span>
          </div>
        `;
        grid.appendChild(card);
      });

      if (filtered.length === 0) {
        grid.innerHTML = '<p class="empty-msg">해당 카테고리에 템플릿이 없습니다.</p>';
      }
    }

    renderTabs();
    renderGrid();
  </script>
</body>
</html>
