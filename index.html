<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>썸네일 메이커</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@600;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="page-index">

  <header class="app-header">
    <span style="font-size:15px;font-weight:700;">🎬 썸네일 메이커</span>
  </header>

  <div class="index-hero">
    <h1>템플릿 선택</h1>
    <p>스타일을 선택하면 바로 편집할 수 있습니다</p>
  </div>

  <div id="category-tabs" class="category-tabs"></div>
  <div id="template-grid" class="index-grid"></div>

  <script src="templates.js"></script>
  <script>
    const tabs    = document.getElementById('category-tabs');
    const grid    = document.getElementById('template-grid');
    const cats    = ['전체', ...new Set(TEMPLATES.map(t => t.category))];
    let active    = '전체';

    function renderTabs() {
      tabs.innerHTML = cats.map(c =>
        `<button class="cat-tab${c === active ? ' active' : ''}" data-cat="${c}">${c}</button>`
      ).join('');
      tabs.querySelectorAll('.cat-tab').forEach(btn =>
        btn.addEventListener('click', () => { active = btn.dataset.cat; renderTabs(); renderGrid(); })
      );
    }

    function renderGrid() {
      const list = active === '전체' ? TEMPLATES : TEMPLATES.filter(t => t.category === active);
      grid.innerHTML = list.map(t => `
        <a class="tmpl-card" href="editor.html?id=${t.id}">
          <img src="${t.thumbnail}" alt="${t.name}" loading="lazy">
          <div class="tmpl-card-info">
            <h3>${t.name}</h3>
            <span class="tmpl-card-badge">${t.category}</span>
          </div>
        </a>
      `).join('');
    }

    renderTabs();
    renderGrid();
  </script>
</body>
</html>
